<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#252e36" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="apple-touch-icon" href="../../assets/logo-180.png" />
    <link rel="stylesheet" href="../../css/reset.css" />
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="stylesheet" href="math-race.css" />
    <link rel="icon" type="image/x-icon" href="../../assets/logo.ico" />

    <script type="module" src="math-race.js"></script>
    <script type="module" src="../../js/highscore.js"></script>
    <title>Math Race</title>
  </head>
  <body>
    <header>
      <img src="../../assets/original_logo.png" alt="Louise Norrsén Logo" class="logo" />
      <h1>Math Race</h1>
    </header>
    <main>
      <section>
        <a href="../../" class="button back-button">← Back to Games</a>
        <button class="button highscore-button" id="highscoreButton">Highscore</button>
      </section>
      <section class="pregame-container" id="pregameContainer">
        <h2 id="game-instructions">Solve the math problems faster to get higher scores!</h2>
        <button class="button start-button" id="startButton">Start Game</button>
      </section>
      <section class="game-container" id="gameContainer">
        <section class="game-info">
          <p class="timer">Timer: <span id="timerDisplay">0</span></p>
          <p class="score">Score: <span id="scoreDisplay">0</span></p>
        </section>
        <h2 id="question"></h2>
        <input type="number" id="answerInput" />
        <button class="button submit-button" id="submitAnswer">Submit Answer</button>
      </section>
    </main>
    <footer>
      <p>&copy; 2026 Louise Norrsén. All rights reserved.</p>
    </footer>
  </body>
</html>
